<!-- Zovelis ribbon logo: gradient "Z" mark above a rounded monoline wordmark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="250 270 760 740">
  <defs>
    <linearGradient id="teal" x1="400" y1="300" x2="853" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55B6C0"/>
      <stop offset="0.6" stop-color="#3E8FAB"/>
      <stop offset="1" stop-color="#3478A6"/>
    </linearGradient>
    <linearGradient id="blue" x1="853" y1="320" x2="410" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2233B0"/>
      <stop offset="0.25" stop-color="#1A24A6"/>
      <stop offset="0.6" stop-color="#3550A8"/>
      <stop offset="1" stop-color="#4885B2"/>
