# Zovelis OS: compressed swap in RAM. It keeps computers with little memory
# responsive and avoids writing to the disk. Up to half of the RAM (at most
# 8 GiB) can hold compressed pages; nothing is reserved until it is used.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
