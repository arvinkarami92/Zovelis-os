# Zovelis OS kernel hardening defaults (installed by zovelis-base).
#
# Every setting here is safe for an ordinary desktop. To change one, do not
# edit this file: create /etc/sysctl.d/90-local.conf with your own value,
# which takes precedence.

# --- Kernel information leaks -------------------------------------------
# Hide kernel addresses from unprivileged users (helps against exploits).
kernel.kptr_restrict = 1
# Only administrators may read the kernel log.
kernel.dmesg_restrict = 1
# Programs may only debug (ptrace) their own child processes, so malware
# running as you cannot read the memory of your browser or password manager.
# Debuggers still work when they start the program, or with sudo.
kernel.yama.ptrace_scope = 1
# Restrict performance-monitoring events to administrators.
kernel.perf_event_paranoid = 3

# --- Files in shared directories such as /tmp ---------------------------
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2
# Never write core dumps of programs that changed privileges (e.g. sudo).
fs.suid_dumpable = 0

# --- Network ------------------------------------------------------------
# A desktop is not a router: ignore ICMP redirects and source routing,
# which can be abused to reroute traffic on untrusted networks.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# Protect against SYN floods.
net.ipv4.tcp_syncookies = 1
# Ignore bogus ICMP error responses and broadcast pings.
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
