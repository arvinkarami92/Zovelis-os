# Zovelis OS boot menu settings (installed by zovelis-base).
# The installer writes the rest of the settings to /etc/default/grub.

# Name shown in the boot menu. Its first word ("zovelis") is also the name of
# the EFI boot directory, which GRUB updates use to find and refresh it.
GRUB_DISTRIBUTOR="Zovelis"

# List other installed systems (for example Windows) in the boot menu, so
# computers that dual-boot keep working after Zovelis OS is installed.
GRUB_DISABLE_OS_PROBER=false
