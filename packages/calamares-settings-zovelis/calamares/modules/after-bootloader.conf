# Runs in the live system after Calamares installed GRUB.
---
dontChroot: true
timeout: 600
firmwareType:
  efi:
    - command: "/usr/libexec/zovelis-installer/finish-bootloader efi ${ROOT}"
      timeout: 600
  bios:
    - command: "/usr/libexec/zovelis-installer/finish-bootloader bios ${ROOT} ${gs[bootLoader.installPath]}"
      timeout: 600
