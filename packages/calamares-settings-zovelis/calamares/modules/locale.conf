# Language, formats and time zone.
---
# Used when the location cannot be looked up (no internet connection).
region: "America"
zone: "New_York"
localeGenPath: "/etc/locale.gen"
# Suggest the time zone from the network location (KDE GeoIP service).
geoip:
  style: "json"
  url: "https://geoip.kde.org/v1/calamares"
  selector: ""
