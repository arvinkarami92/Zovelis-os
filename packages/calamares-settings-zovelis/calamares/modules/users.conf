# The first user account. It is an administrator (member of "sudo"): it can
# install software and change system settings after entering its password,
# like the first account on Windows. The root account stays locked.
---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: sudo
    must_exist: true
    system: true
  - name: cdrom
    must_exist: false
    system: true
  - name: floppy
    must_exist: false
    system: true
  - name: audio
    must_exist: false
    system: true
  - name: dip
    must_exist: false
    system: true
  - name: video
    must_exist: false
    system: true
  - name: plugdev
    must_exist: false
    system: true
  - name: netdev
    must_exist: false
    system: true
  - name: bluetooth
    must_exist: false
    system: true
  - name: lpadmin
    must_exist: false
    system: true
  - name: scanner
    must_exist: false
    system: true

# Debian's /etc/sudoers already grants the "sudo" group administrator rights,
# so Calamares must not write another sudoers file.
# (sudoersGroup is intentionally not set.)

setRootPassword: false
doReusePassword: false
doAutologin: false

# At least 6 characters; the password protects an administrator account.
passwordRequirements:
  minLength: 6
  maxLength: 128
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  # Names already used by system accounts or groups of a Zovelis OS system;
  # choosing one of them would make creating the account fail.
  forbidden_names: [ root, daemon, bin, sys, sync, games, man, lp, mail, news,
                     uucp, proxy, www-data, backup, list, irc, nobody, nogroup,
                     _apt, messagebus, avahi, sddm, polkitd, rtkit, colord,
                     saned, usbmux, geoclue, dnsmasq, tss, fwupd-refresh,
                     cups-pk-helper, cups-browsed, speech-dispatcher, pulse,
                     uuidd, tcpdump, systemd-network, systemd-timesync,
                     systemd-journal, systemd-resolve, systemd-coredump,
                     adm, tty, disk, kmem, dialout, fax, voice, cdrom, floppy,
                     tape, sudo, audio, dip, video, plugdev, netdev, bluetooth,
                     lpadmin, scanner, staff, users, operator, src, shadow,
                     utmp, sasl, input, render, kvm, sgx, crontab, ssl-cert,
                     ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-${product}"
  forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
  fullName:
    editable: true
  loginName:
    editable: true
