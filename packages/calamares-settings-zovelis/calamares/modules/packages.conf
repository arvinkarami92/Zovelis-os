# Remove what only the live system needs. Works offline: no package lists
# are downloaded and nothing is installed from the internet.
---
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false
operations:
  - remove:
      - calamares-settings-zovelis
      - calamares
  - try_remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
      - live-tools
      - user-setup
