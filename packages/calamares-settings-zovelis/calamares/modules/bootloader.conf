# Boot loader: GRUB, with Secure Boot support on UEFI (Debian's signed shim
# and GRUB are installed; grub-install uses them automatically).
---
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
loaderEntries:
  - "timeout 5"
kernelParams: [ "quiet" ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# Must equal the first word of GRUB_DISTRIBUTOR, in lower case: GRUB package
# updates look for /boot/efi/EFI/<that word> to refresh the boot loader.
efiBootloaderId: "zovelis"
# The fallback copy (EFI/BOOT/BOOTX64.EFI) is set up by zovelisbootloader@finish
# with Debian's grub-install --force-extra-removable, which also handles
# Secure Boot (shim). Calamares' own copy would not.
installEFIFallback: false
