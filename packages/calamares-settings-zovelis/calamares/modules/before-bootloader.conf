# Runs in the live system before GRUB is set up in the new system.
---
dontChroot: true
timeout: 900
firmwareType:
  efi:
    - command: "/usr/libexec/zovelis-installer/prepare-bootloader efi ${ROOT}"
      timeout: 900
  bios:
    - command: "/usr/libexec/zovelis-installer/prepare-bootloader bios ${ROOT} ${gs[bootLoader.installPath]}"
      timeout: 900
