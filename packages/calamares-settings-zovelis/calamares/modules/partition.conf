# Disk setup.
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 256MiB
  label: "EFI"

# Swap: a swap file inside the system partition (no extra partition to
# manage), or none. Zovelis OS also uses compressed swap in RAM (zram).
userSwapChoices:
  - none
  - file
initialSwapChoice: file

# Optional full-disk encryption (LUKS) in the automatic modes. GRUB can only
# unlock LUKS1 volumes (or LUKS2 with PBKDF2), so use LUKS1.
luksGeneration: luks1
enableLuksAutomatedPartitioning: true

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: true

# Do not preselect "Erase disk": the user must choose what happens to the
# disk on purpose.
initialPartitioningChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

# The live system's own mounts must never be unmounted.
essentialMounts: [ "live-*", "control", "ventoy" ]

# No LVM buttons in manual partitioning: the image does not include lvm2
# (and its background services), so the new system could not start from
# logical volumes.
lvm:
  enable: false
