# /etc/fstab and /etc/crypttab for the new system.
---
# Debian's initramfs reads the key file created by luksbootkeyfile this way,
# so the disk password is only asked for once (by GRUB).
crypttabOptions: luks,keyscript=/bin/cat
tmpOptions:
  default:
    tmpfs: false
    options: ""
  ssd:
    tmpfs: false
    options: ""
