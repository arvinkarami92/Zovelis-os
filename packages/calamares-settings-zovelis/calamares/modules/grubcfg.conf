# Settings written to /etc/default/grub of the new system.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
# "splash" is added automatically because Plymouth is installed.
kernel_params: [ "quiet" ]
defaults:
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: "0"
  GRUB_DISABLE_SUBMENU: false
  GRUB_DISABLE_RECOVERY: false
always_use_defaults: false
