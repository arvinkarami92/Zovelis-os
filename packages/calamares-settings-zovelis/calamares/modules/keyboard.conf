# Keyboard layout. Debian systems keep it in /etc/default/keyboard, which the
# console, the login screen and the desktop all follow.
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
