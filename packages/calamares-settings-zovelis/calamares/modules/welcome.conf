# SPDX-License-Identifier: GPL-3.0-or-later
# Welcome page and installation requirements.
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  # Room for the system, updates and some personal files (GiB).
  requiredStorage: 12
  # Plasma runs in 2 GiB; 4 GiB or more is recommended.
  requiredRam: 2.0
  # Only used for the "connected to the internet" hint; installing works
  # without a connection.
  internetCheckUrl:
    - https://networkcheck.kde.org/
    - http://deb.debian.org/
  check:
    - storage
    - ram
    - power
    - internet
    - root
    - screen
  required:
    - storage
    - ram
    - root

