# Zovelis OS installer (Calamares) — main configuration.
---
# "local" is Calamares' own module directory; the second directory holds
# the Zovelis OS module (zovelisbootloader).
modules-search: [ local, /usr/share/calamares-settings-zovelis/modules ]

# Module instances with their own configuration files.
instances:
  # Installs the boot loader packages that match the firmware (BIOS or UEFI)
  # from the installation medium, before Calamares sets up GRUB.
  - id: prepare
    module: zovelisbootloader
    config: zovelisbootloader-prepare.conf
  # Completes the boot loader setup (fallback EFI path, update settings).
  - id: finish
    module: zovelisbootloader
    config: zovelisbootloader-finish.conf
  # Final checks and cleanup of the installed system.
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - zovelisbootloader@prepare
      - grubcfg
      - bootloader
      - zovelisbootloader@finish
      # Removes the installer and the live-system tools from the new system.
      # Must run before initramfs: live-tools diverts update-initramfs.
      - packages
      - plymouthcfg
      - initramfscfg
      - initramfs
      - shellprocess@cleanup
      - preservefiles
      - umount
  - show:
      - finished

branding: zovelis

# Ask for confirmation before anything is written to disk.
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
# Once the disk is being changed, stopping half-way would leave it unusable.
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
