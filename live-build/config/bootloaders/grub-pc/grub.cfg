# Zovelis OS live/installation medium: boot menu (UEFI).
# @...@ markers are filled in by live-build.
source /boot/grub/config.cfg

menuentry "Try or Install Zovelis OS" --hotkey=t {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Try or Install Zovelis OS (safe graphics)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

submenu "Utilities..." --hotkey=u {
	source /boot/grub/theme.cfg

	# live-build removes memtest.cfg when there is no memory tester. (Its
	# own template appends "-a false" to the test instead, but GRUB's test
	# command treats the word "false" as true.)
	if [ "${grub_platform}" = "pc" -a -e /boot/grub/memtest.cfg ]; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" {
			fwsetup
		}
	fi

	menuentry "Boot the next device (e.g. the hard disk)" {
		exit 1
	}
}
