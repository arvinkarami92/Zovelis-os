# Zovelis OS boot menu settings (live medium).
set default=0
# Start "Try or Install Zovelis OS" automatically after 10 seconds.
set timeout=10
set timeout_style=menu

loadfont $prefix/noto-sans-regular-16.pf2
loadfont $prefix/noto-sans-regular-20.pf2
loadfont $prefix/noto-sans-bold-20.pf2
loadfont $prefix/unicode.pf2
set gfxmode=auto
insmod all_video
insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

# A short beep tells people who cannot see the screen that the menu is
# ready (same as Debian's live images).
insmod play
play 960 440 1 0 4 440 1
