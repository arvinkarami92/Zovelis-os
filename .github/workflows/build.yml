# SPDX-License-Identifier: GPL-3.0-or-later
# Build the Zovelis OS packages and ISO, then boot the ISO in QEMU/KVM
# (BIOS and UEFI) and check the live system from the inside.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: ./scripts/setup-build-env.sh
      - name: Static checks and unit tests
        run: ./tests/run-static-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-check-results
          path: build/test-results

  iso:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build packages and ISO (Debian 13 container)
        run: ./scripts/build-in-container.sh all
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot tests (BIOS, UEFI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          ./tests/vm/run-vm-tests.sh build/out/zovelis-os-*-amd64.iso bios uefi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-test-results
          path: build/vm-results
      - uses: actions/upload-artifact@v4
        with:
          name: zovelis-os-iso
          path: |
            build/out/*.iso
            build/out/*.sha256
            build/out/*.packages
          compression-level: 0
