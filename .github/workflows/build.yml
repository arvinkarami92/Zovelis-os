# SPDX-License-Identifier: GPL-3.0-or-later
# Build the Zovelis OS packages and ISO, then boot the ISO in QEMU/KVM
# (BIOS, UEFI, UEFI with Secure Boot) and check the live system from the
# inside.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      # The installer helper and build-chroot tests use bind mounts and
      # private mount namespaces, which need CAP_SYS_ADMIN.
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: ./scripts/setup-build-env.sh
      - name: Calamares 3.3.14 sources (installer configuration schemas)
        run: |
          apt-get install -y --no-install-recommends git
          git clone --quiet --depth 1 --branch v3.3.14 https://github.com/calamares/calamares.git /opt/calamares
      - name: Static checks and unit tests
        run: ./tests/run-static-checks.sh
        env:
          CALAMARES_SRC: /opt/calamares
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-check-results
          path: build/test-results

  iso:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build packages and ISO (Debian 13 container)
        run: ./scripts/build-in-container.sh all
      - name: Hand the build results to the runner's user
        # The container build runs as root; the tests below write into build/.
        run: |
          sudo mkdir -p build/vm build/vm-results
          sudo chown "$(id -u):$(id -g)" build build/vm build/vm-results
          sudo chown -R "$(id -u):$(id -g)" build/out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot tests (BIOS, UEFI, UEFI with Secure Boot)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          ./tests/vm/run-vm-tests.sh build/out/zovelis-os-*-amd64.iso bios uefi uefi-secure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-test-results
          path: build/vm-results
      - uses: actions/upload-artifact@v4
        with:
          name: zovelis-os-iso
          path: |
            build/out/*.iso
            build/out/*.sha256
            build/out/*.packages
          compression-level: 0
